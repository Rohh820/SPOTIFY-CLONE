<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SPOTIFY CLONE</title>
    <link rel="stylesheet" href="style2.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
   <div class="main">
     <div class="sidebar">
        <div class="nav">
           <div class="nav-option">
              <i class="fa-solid fa-house"></i>
             <a href="#">Home</a>
           </div>
           <div class="nav-option">
            <i class="fa-solid fa-magnifying-glass"></i>
             <a href="#">Search</a>
           </div>
        </div>
        <div class="library">
            <div class="options">
              <div class="lib-options">
                <img src="library_icon.png">
                <a href="#">Your library</a>
              </div>
              <div class="lib-icons">
                <i class="fa-solid fa-plus"></i>
                <i class="fa-solid fa-arrow-right"></i>
              </div>
            </div>
            <div class="extra-options">
                <div class="option-one">
                    <p class="p1">create your first playlist</p>
                    <p class="p2">It's easy, we'll help you</p>
                    <button class="badge">create playlist</button>
                </div>
                <div class="option-two">
                    <p class="p1">let's find some podcast to follow</p>
                    <p class="p2">we we'll keep you updated on new episodes</p>
                    <button class="badge">Browse podcasts</button>
                </div>
            </div>
        </div>
        
     </div>
     <div class="main-content">
        <div class="sticky-nav">
            <div class="nav-icons">
                <img class="icon-one" src="backward_icon.png"/>
                <img class="icon-two" src="forward_icon.png"/>
            </div>
            <div class="explore">
                <button class="badge btn-one">Explore premium</button>
                <button class="badge btn-two"><i class="fa-solid fa-download"></i>Install</button>
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
        <h2>Recently played</h2>
        <div class="cards-container">
            <div class="card">
                <img src="card1img.jpeg">
                <p class="global">TOP 50-GLOBAL</p>
                <P style="font-size: 1rem">Your daily updates of most played tracks...</P>
            </div>
        </div>
     </div>
     <div class="music-player">music-player</div>
   </div>
</body>
</html>
